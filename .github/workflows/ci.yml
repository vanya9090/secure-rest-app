name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sast:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run Bandit
        run: |
          mkdir -p reports
          uv run --locked bandit -r app -f json -o reports/bandit.json

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: reports/bandit.json
          if-no-files-found: ignore

  sca:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Export dependencies for Snyk
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes \
            --output-file requirements-snyk.txt

      - name: Install Snyk
        uses: snyk/actions/setup@master

      - name: Scan dependencies
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          mkdir -p reports
          snyk test \
            --file=requirements-snyk.txt \
            --package-manager=pip \
            --command=.venv/bin/python \
            --json-file-output=reports/snyk.json

      - name: Upload Snyk report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: reports/snyk.json
          if-no-files-found: ignore
